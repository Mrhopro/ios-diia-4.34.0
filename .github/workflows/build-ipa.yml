name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "A unique Bundle ID, for example com.mrhopro.diiaopensource"
        required: true
        default: "com.mrhopro.diiaopensource"
        type: string

jobs:
  build:
    runs-on: macos-15
    env:
      PROJECT: DiiaOpenSource.xcodeproj
      SCHEME: DiiaOpenSource
      BUNDLE_ID: ${{ inputs.bundle_id }}
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      IPA_PATH: ${{ github.workspace }}/build/DiiaOpenSource-unsigned.ipa

    steps:
      - uses: actions/checkout@v4

      - name: Verify source tree
        run: |
          test -f "$PROJECT/project.pbxproj"
          test -f "DiiaOpenSource/Info.plist"
          test -f "DiiaOpenSource/SupportingFiles/Configurations/DiiaDev.xcconfig"

      - name: Set Bundle ID for this build
        run: |
          sed -i '' "s/^APP_BUNDLE_ID = .*/APP_BUNDLE_ID = $BUNDLE_ID/" \
            DiiaOpenSource/SupportingFiles/Configurations/DiiaDev.xcconfig \
            DiiaOpenSource/SupportingFiles/Configurations/DiiaProd.xcconfig

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build without Apple signing
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/DiiaOpenSource.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload "$IPA_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: DiiaOpenSource-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
